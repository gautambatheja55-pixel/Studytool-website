<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script defer src="pomodoro.js"></script>
</head>
<body>

<nav>
    <label class="logo">Pomodoro</label>

    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="calendar.html">Calendar</a></li>
         <li><a href="pomodoro.html">Pomodoro</a></li>
        <li><a href="Stopwatch.html">Stopwatch</a></li>
    </ul>
</nav>
<div class="pomodoro">
    <div class="timer-section">
    <div class="timer">25:00</div>
    <button class="start">Start</button>
    <div class="secondary">
    <button id="reset">Reset</button>
    <button id="pause">Pause</button>
    </div>
</div>
    <div class="settings-section">
        <div class="inputs-container">
            <div class="time-input">
                <label for="work-time">Work Time (minutes):</label>
                <input type="number" id="work-time" value="25" min="1">
            </div>
            <div class="break-input">
                <label for="break-time">Break Time (minutes):</label>
                <input type="number" id="break-time" value="5" min="1">
            </div>
        </div>

        <audio src="beep.mp3" id="beep-sound"></audio>
            <div class="stats-container">
            <div class="stat">
            <div class="stat-value" id="completedSessions">0</div>
            <div class="stat-label">Completed</div>
        </div>

        <div class="stat">
            <div class="stat-value" id="Totaltime">0h 0m</div>
            <div class="stat-label">Total Time</div>
        </div>

        <div class="stat">
            <div class="stat-value" id="Totalstreaks">0</div>
            <div class="stat-label">Streaks</div>
        </div>
    </div>
</div>
</body>
</html>
