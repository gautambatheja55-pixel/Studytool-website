<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calendar</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="calender.css"> # the css <lightning-input-address

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"
    >

    <script src="script.js" defer></script>
</head>

<body>

<!-- NAVIGATION BAR -->
<nav>
    <label class="logo">Study Site</label>

    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="study.html">Study</a></li>
        <li><a href="calender.html">Calendar</a></li>
        <li><a href="AI.html">Contact</a></li>
        <li><a href="login.html">Login</a></li>
    </ul>
</nav>


<!-- CALENDAR -->
<div class="container">

    <div class="left">

        <div class="calendar">

            <div class="month">
                <i class="fas fa-angle-left prev"></i>

                <div class="date">September 2026</div>

                <i class="fas fa-angle-right next"></i>
            </div>

            <div class="weekdays">
                <div>Sun</div>
                <div>Mon</div>
                <div>Tue</div>
                <div>Wed</div>
                <div>Thu</div>
                <div>Fri</div>
                <div>Sat</div>
            </div>

            <div class="days"></div>

            <div class="goto-today">

                <div class="goto">
                    <input
                        type="text"
                        placeholder="mm/yyyy"
                        class="date-input"
                    >

                    <button class="goto-btn">Go</button>
                </div>

                <button class="today-btn">Today</button>

            </div>

        </div>

    </div>


    <!-- EVENTS -->
    <div class="right">

        <div class="today-date">
            <div class="event-day">Wed</div>
            <div class="event-date">16th September 2026</div>
        </div>

        <div class="events">

            <div class="add-event-wrapper">

                <div class="add-event-header">
                    <div class="title">Add Event</div>
                    <i class="fas fa-times close"></i>
                </div>

                <div class="add-event-body">

                    <div class="add-event-input">
                        <input
                            type="text"
                            placeholder="Event Name"
                            class="event-name"
                        >
                    </div>

                    <div class="add-event-input">
                        <input
                            type="text"
                            placeholder="Event Time From"
                            class="event-time-from"
                        >
                    </div>

                </div>

                <div class="add-event-footer">
                    <button class="add-event-btn">Add Event</button>
                </div>

            </div>

            <button class="add-event">
                <i class="fas fa-plus"></i>
            </button>

        </div>

    </div>

</div>


<!-- AI CHATBOT BUTTON -->
<div class="ai_chatbot">
    <span class="ai_icon">🤖 AI</span>
    <span class="ai_text">Ask Doubts</span>
</div>


<!-- AI FULLSCREEN CHAT -->
<div class="ai_fullscreen">

    <button class="ai_close">X</button>

    <h1 id="heading">Ask Your Doubts Here</h1>

    <textarea
        class="searchbar"
        placeholder="Type your question here..."
    ></textarea>

</div>

</body>
</html>
